<style>
/* ===============================
   全域骨架（footer 穩定）
================================ */
html, body {
    height: 100%;
    margin: 0;
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #333;

    background-image: url('https://github.com/Sethjesus/Photo/blob/main/sky6.jpg?raw=true');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* 主內容撐滿 */
main {
    flex: 1;
}

/* ===============================
   Logo（左上角漂浮）
================================ */
.logo {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 60px;
    z-index: 9999;
    animation: floatLogo 3s ease-in-out infinite;
}
@keyframes floatLogo {
    0% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.1) translateY(-5px); }
    100% { transform: scale(1) translateY(0); }
}

/* ===============================
   標題
================================ */
h1 {
    text-align: center;
    margin: 28px 0 24px;
    color: #007bff;
    font-size: 48px;
}

/* ===============================
   內容容器
================================ */
.container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto 40px;
    padding: 20px;
    background: rgba(255,255,255,.9);
    border-radius: 10px;
}

/* ===============================
   表格
================================ */
.content-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
.content-table td {
    padding: 20px;
    border: 3px solid #f1e2e2;
    vertical-align: middle;
}
.first-row td {
    background-color: #007bff;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
}
.highlight {
    font-size: 24px;
    font-weight: bold;
    color: #071a2e;
}

/* ===============================
   圖片格線
================================ */
.image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}
.image-grid a {
    display: block;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,.2);
    transition: transform .3s ease, box-shadow .3s ease;
}
.image-grid img {
    width: 100%;
    border-radius: 8px;
    transition: transform .3s ease;
}
.image-grid a:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 16px rgba(0,0,0,.3);
}
.image-grid a:hover img {
    transform: scale(1.1);
}

/* ===============================
   統一浮動回首頁（全站唯一）
================================ */
.float-home-btn{
    position: fixed;
    right: 22px;
    bottom: 22px;

    width: 64px;
    height: 72px;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    background: linear-gradient(135deg,#0b6bff,#00c6ff);
    color: #fff;
    text-decoration: none;
    font-weight: 700;

    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    z-index: 9999;

    transition: transform .2s ease, box-shadow .2s ease;
}
.float-home-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 18px 38px rgba(0,0,0,.45);
}
.float-home-btn .icon{ font-size: 24px; }
.float-home-btn .label{ font-size: 12px; }

@media (max-width: 768px){
    .float-home-btn{
        width: 56px;
        height: 64px;
        right: 16px;
        bottom: 16px;
    }
}

/* ===============================
   Footer
================================ */
footer {
    text-align: center;
    padding: 18px;
    background: #2c3e50;
    color: #fff;
}
